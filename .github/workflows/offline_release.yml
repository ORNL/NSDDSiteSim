name: Create Offline Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  release-offline-package:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t lanesim:latest .
          docker save lanesim:latest -o lanesim-image.tar

      - name: Prepare Offline Package
        run: |
          mkdir offline-package
          mv lanesim-image.tar offline-package/

          # Create an offline-friendly docker-compose.yml
          cat << 'EOF' > offline-package/docker-compose.yml
          services:
            lanesim:
              image: lanesim:latest
              ports:
                - "8000:8000"
                - "9001-9050:9001-9050"
                - "10001-10050:10001-10050"
              volumes:
                - ./data:/opt/lanesim/data
                - ./logs:/opt/lanesim/logs
                - ./videos:/opt/lanesim/videos
              environment:
                - SITE_TZ=America/New_York
              restart: unless-stopped
          EOF

          # Create a helper script to load and run
          cat << 'EOF' > offline-package/start.sh
          #!/bin/bash
          echo "Loading lanesim Docker image..."
          docker load -i lanesim-image.tar
          echo "Starting lanesim..."
          docker compose up -d
          echo "Lane Simulator is starting. Access it at http://localhost:8000"
          EOF

          chmod +x offline-package/start.sh

          # Zip the package
          cd offline-package
          zip -r ../lanesim-offline.zip .
          cd ..

      - name: Generate Release Tag
        id: generate_tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag }}
          name: Release ${{ steps.generate_tag.outputs.tag }}
          body: |
            ## Lane Simulator Offline Package

            This release contains everything needed to run Lane Simulator completely offline.

            **Instructions:**
            1. Download and extract `lanesim-offline.zip`.
            2. Run `./start.sh` (or manually run `docker load -i lanesim-image.tar` then `docker compose up -d`).
            3. Open your browser to `http://localhost:8000`.
          files: lanesim-offline.zip
