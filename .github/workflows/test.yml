name: Test

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Validate RPM-only installer shell
        run: bash -n scripts/install-rpm-only-systemd.sh

      - name: Run tests
        run: python -m pytest -q
