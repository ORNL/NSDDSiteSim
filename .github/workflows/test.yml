name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Verify zero private LAN IPs or embedded keys
        run: |
          if git grep -En '\b(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]{1,3}\.[0-9]{1,3})\b|BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "Private LAN IP or private key detected in tracked files." >&2
            exit 1
          fi

      - name: Validate installer shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/install-rpm-only-systemd.sh

      - name: Run tests
        run: python -m pytest -q
